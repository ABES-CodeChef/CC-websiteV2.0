<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle Border -->
  <circle cx="300" cy="300" r="298" stroke="white" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Ticks -->
  <g stroke="white" stroke-width="2">
    <!-- Major Ticks (every 30 degrees) -->
    <line x1="300" y1="10" x2="300" y2="40" transform="rotate(0 300 300)" />
    <line x1="300" y1="10" x2="300" y2="40" transform="rotate(30 300 300)" />
    <line x1="300" y1="10" x2="300" y2="40" transform="rotate(60 300 300)" />
    <line x1="300" y1="10" x2="300" y2="40" transform="rotate(90 300 300)" />
    <line x1="300" y1="10" x2="300" y2="40" transform="rotate(120 300 300)" />
    <line x1="300" y1="10" x2="300" y2="40" transform="rotate(150 300 300)" />
    <line x1="300" y1="10" x2="300" y2="40" transform="rotate(180 300 300)" />
    <line x1="300" y1="10" x2="300" y2="40" transform="rotate(210 300 300)" />
    <line x1="300" y1="10" x2="300" y2="40" transform="rotate(240 300 300)" />
    <line x1="300" y1="10" x2="300" y2="40" transform="rotate(270 300 300)" />
    <line x1="300" y1="10" x2="300" y2="40" transform="rotate(300 300 300)" />
    <line x1="300" y1="10" x2="300" y2="40" transform="rotate(330 300 300)" />
    
    <!-- Minor Ticks (every 6 degrees) -->
    <!-- Simplified for file size, just adding a dashed circle effect instead of 60 lines -->
    <circle cx="300" cy="300" r="280" stroke="white" stroke-width="1" stroke-dasharray="2 18" stroke-opacity="0.5" />
  </g>
  
  <!-- Inner dashed circle -->
  <circle cx="300" cy="300" r="250" stroke="white" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.1"/>
</svg>
